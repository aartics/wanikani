<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WaniKani" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f0f1a" />
    <title>WaniKani</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">

      <!-- ── Home ─────────────────────────────────────────────────────── -->
      <div id="home-screen" class="screen active">
        <div class="home-inner">
          <header class="home-header">
            <h1>和<span>WaniKani</span></h1>
            <button id="refresh-btn" class="icon-btn" title="Refresh">↺</button>
          </header>

          <div class="review-count-card">
            <span class="count" id="reviews-count">—</span>
            <span class="label">Reviews available</span>
          </div>

          <div class="actions">
            <button class="btn-primary" id="start-reviews-btn">Start Reviews</button>
            <button class="btn-secondary" id="start-lessons-btn">Start Lessons</button>
          </div>

          <p class="home-hint" id="home-hint"></p>
        </div>
      </div>

      <!-- ── Reviews ───────────────────────────────────────────────────── -->
      <div id="review-screen" class="screen">

        <header class="session-header">
          <button class="icon-btn" id="review-back-btn">✕</button>
          <div class="progress-wrap">
            <span id="progress-text">0 / 0</span>
            <div class="progress-bar"><div id="progress-fill"></div></div>
          </div>
          <span class="type-badge" id="type-badge"></span>
        </header>

        <!-- Fixed: never moves regardless of keyboard -->
        <div class="char-display" id="char-display"></div>

        <!-- Fixed: input stays put even when keyboard opens -->
        <section class="quiz-section" id="quiz-section">
          <div class="section-label" id="section-label">Meaning</div>
          <form id="answer-form" onsubmit="return false;">
            <input
              id="answer-input"
              type="text"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="none"
              spellcheck="false"
            />
            <button type="submit" class="submit-btn-wide" id="answer-submit">Submit →</button>
          </form>
          <div class="result-row" id="answer-result"></div>
          <button class="give-up-btn hidden" id="answer-giveup">Show answer</button>
        </section>

        <!-- Fixed: sits right below the input, above the scrollable info -->
        <button class="btn-next hidden" id="next-btn">Next →</button>

        <!-- Only this region scrolls — everything above is locked -->
        <div class="item-info hidden" id="item-info">
          <button class="reveal-btn hidden" id="meaning-reveal-btn">Show meaning ▾</button>
          <div class="reveal-content hidden" id="meaning-reveal">
            <div class="info-row" id="info-meanings"></div>
          </div>

          <button class="reveal-btn hidden" id="reading-reveal-btn">Show reading ▾</button>
          <div class="reveal-content hidden" id="reading-reveal">
            <div class="info-row" id="info-readings"></div>
            <div class="info-row" id="info-pos"></div>
          </div>

          <button class="reveal-btn hidden" id="explanation-reveal-btn">Show explanation ▾</button>
          <div class="reveal-content hidden" id="explanation-reveal">
            <div class="info-row" id="info-meaning-mnemonic"></div>
            <div class="info-row" id="info-reading-mnemonic"></div>
          </div>
        </div>

      </div>

      <!-- ── Lessons ────────────────────────────────────────────────────── -->
      <div id="lesson-screen" class="screen">

        <header class="session-header">
          <button class="icon-btn" id="lesson-back-btn">✕</button>
          <div class="progress-wrap">
            <span id="lesson-progress-text">0 / 0</span>
            <div class="progress-bar"><div id="lesson-progress-fill"></div></div>
          </div>
          <span class="type-badge" id="lesson-type-badge"></span>
        </header>

        <div class="char-display" id="lesson-char-display"></div>

        <!-- Scrollable lesson info -->
        <div class="item-info lesson-info-panel" id="lesson-body">
          <div class="lesson-row">
            <span class="lesson-key">Meanings</span>
            <span id="lesson-meanings"></span>
          </div>
          <div class="lesson-row" id="lesson-reading-row">
            <span class="lesson-key">Readings</span>
            <span id="lesson-readings"></span>
          </div>
          <div class="lesson-row" id="lesson-mnemonic-row">
            <span class="lesson-key">Meaning hint</span>
            <span id="lesson-mnemonic"></span>
          </div>
          <div class="lesson-row" id="lesson-reading-mnemonic-row">
            <span class="lesson-key">Reading hint</span>
            <span id="lesson-reading-mnemonic"></span>
          </div>
        </div>

        <button class="btn-next" id="lesson-next-btn">Got it →</button>

      </div>

      <!-- ── Complete ───────────────────────────────────────────────────── -->
      <div id="complete-screen" class="screen">
        <div class="complete-wrap">
          <div class="complete-emoji" id="complete-emoji">✓</div>
          <h2>Session Complete</h2>
          <p id="complete-stats"></p>
          <p class="submit-status" id="submit-status"></p>
          <button class="btn-primary" id="done-btn">Back to Home</button>
        </div>
      </div>

    <!-- Toast for submission errors — floats over any screen -->
    <div id="error-toast" class="error-toast hidden"></div>

    </div><!-- #app -->

    <script src="/wanakana.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
